interface:
  display_name: "CoreStory Behavioral Verification"
  short_description: "Compare modernized code to rules"
  default_prompt: "Use $behavioral-verification to do this CoreStory modernization step."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the repository folder with: corestory mcp (in Codex, set cwd to the repository)
      transport: stdio
