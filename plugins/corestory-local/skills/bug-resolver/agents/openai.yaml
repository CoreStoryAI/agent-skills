interface:
  display_name: "CoreStory Local Bug Resolver"
  short_description: "Resolve bugs with local graph evidence"
  default_prompt: "Use $bug-resolver to investigate and fix this defect with CoreStory local tools."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the workspace with: corestory mcp --path <workspace> --no-watch
      transport: stdio
