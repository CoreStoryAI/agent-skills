interface:
  display_name: "CoreStory Local Codebase Assessment"
  short_description: "Modernization readiness and risk report"
  default_prompt: "Use $codebase-assessment to assess this codebase with CoreStory local tools."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the repository folder with: corestory mcp (in Codex, set cwd to the repository)
      transport: stdio
