interface:
  display_name: "CoreStory Local Ask"
  short_description: "Compare CoreStory with source evidence"
  default_prompt: "Use $corestory-ask to compare this CoreStory finding with the repository source."
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the workspace with: corestory mcp --path <workspace> --no-watch
      transport: stdio
