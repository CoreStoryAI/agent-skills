interface:
  display_name: "CoreStory Decomposition and Sequencing"
  short_description: "Sequence work packages from the plan"
  default_prompt: "Use $decomposition-sequencing to do this CoreStory modernization step."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the repository folder with: corestory mcp (in Codex, set cwd to the repository)
      transport: stdio
