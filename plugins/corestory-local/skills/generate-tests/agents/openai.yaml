interface:
  display_name: "CoreStory Local Test Generation"
  short_description: "Generate behavioral tests from rule evidence"
  default_prompt: "Use $generate-tests to find behavioral gaps and add tests with CoreStory local tools."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the repository folder with: corestory mcp (in Codex, set cwd to the repository)
      transport: stdio
