interface:
  display_name: "CoreStory Local Test Generation"
  short_description: "Generate tests from local evidence"
  default_prompt: "Use $generate-tests to find behavioral gaps and add tests with CoreStory local tools."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the workspace with: corestory mcp --path <workspace> --no-watch
      transport: stdio
