interface:
  display_name: "CoreStory Local Technical Due Diligence"
  short_description: "Acquisition-target technical risk report"
  default_prompt: "Use $ma-technical-due-diligence to review this codebase with CoreStory local tools."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the repository folder with: corestory mcp (in Codex, set cwd to the repository)
      transport: stdio
