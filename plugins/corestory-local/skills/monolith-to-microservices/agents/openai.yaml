interface:
  display_name: "CoreStory Monolith to Microservices"
  short_description: "Design a service extraction"
  default_prompt: "Use $monolith-to-microservices to do this CoreStory modernization step."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the repository folder with: corestory mcp (in Codex, set cwd to the repository)
      transport: stdio
