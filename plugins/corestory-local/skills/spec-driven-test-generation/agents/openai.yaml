interface:
  display_name: "CoreStory Local Test Routing"
  short_description: "Pick behavioral or end-to-end test generation"
  default_prompt: "Use $spec-driven-test-generation to choose and run the right test-generation workflow."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the repository folder with: corestory mcp (in Codex, set cwd to the repository)
      transport: stdio
