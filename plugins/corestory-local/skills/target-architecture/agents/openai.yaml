interface:
  display_name: "CoreStory Target Architecture"
  short_description: "Compare strategies and record the ADR"
  default_prompt: "Use $target-architecture to do this CoreStory modernization step."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the repository folder with: corestory mcp (in Codex, set cwd to the repository)
      transport: stdio
