interface:
  display_name: "CoreStory Local with Jira"
  short_description: "Ground Jira tickets in local code evidence"
  default_prompt: "Use $using-corestory-with-jira to work a Jira ticket with CoreStory local tools."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory-local
      description: >-
        Local CoreStory code intelligence.
        Start it from the repository folder with: corestory mcp (in Codex, set cwd to the repository)
      transport: stdio
    - type: mcp
      value: atlassian
      description: >-
        Optional Jira access for ticket intake and updates. Without it, paste the ticket text.
        Atlassian's Rovo MCP server is the usual option for Jira Cloud.
      transport: sse
      url: https://mcp.atlassian.com/v1/sse
