interface:
  display_name: "CoreStory Business Rules"
  short_description: "Extract and verify business rules"
  default_prompt: "Use $business-rules-extraction to help with this CoreStory workflow."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: corestory
      description: >-
        CoreStory code intelligence. The MCP URL is per-organization; Codex cannot
        expand config values here, so this placeholder is deliberately unusable.
        Run: codex mcp add corestory --url <your org URL from CoreStory settings>
      transport: streamable_http
      url: https://REPLACE-WITH-YOUR-ORG-MCP-URL.invalid
