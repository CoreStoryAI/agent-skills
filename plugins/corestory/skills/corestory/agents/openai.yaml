interface:
  display_name: "CoreStory"
  short_description: "Use CoreStory code intelligence"
  default_prompt: "Use $corestory to help with this CoreStory workflow."
policy:
  # router: its description defers to the specialized skills, so it should not compete with them
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: mcp
      value: corestory
      description: >-
        CoreStory code intelligence. The MCP URL is per-organization; Codex cannot
        expand config values here, so this placeholder is deliberately unusable.
        Run: codex mcp add corestory --url <your org URL from CoreStory settings>
      transport: streamable_http
      url: https://REPLACE-WITH-YOUR-ORG-MCP-URL.invalid
